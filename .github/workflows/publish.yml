name: Publish Package to NuGet

# Trigger this workflow whenever a new release is published
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Check out the repository's code at the released tag
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Step 2: Set up .NET 8 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore YubionFssSdk.sln

      # Step 4: Build and run unit tests
      - name: Build and Test
        run: |
          dotnet build YubionFssSdk.sln -c Release --no-restore
          dotnet test YubionFssSdk.sln -c Release --no-build

      # Step 5: Pack NuGet package
      - name: Pack NuGet package
        run: dotnet pack src/YubiOn.Fss.Sdk/YubiOn.Fss.Sdk.csproj -c Release --no-build -o ./artifacts

      # Step 6: Authenticate with NuGet.org via Trusted Publishing (OIDC)
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Step 7: Publish to NuGet.org using temporary OIDC-issued API key
      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
